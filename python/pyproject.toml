[project]
name = "galaxy"
version = "0.4.0"
description = "A fictional galaxy for telling stories in: the catalogue, the procedural galaxy, orbits, travel, gate networks and territories through time, and the data the 3D maps draw"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    # ── territories ──────────────────────────────────────────────────────────
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "shapely>=2.0.0",
    # ── the procedural galaxy: the image its density is read from ─────────────
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galaxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
